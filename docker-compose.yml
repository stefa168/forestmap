name: seaweedfs

services:
  master:
    image: chrislusf/seaweedfs:4.41
    restart: unless-stopped
    networks: [ storage ]
    container_name: seaweed-master
    command:
      - master
      - -ip=master
      - -ip.bind=0.0.0.0
      - -mdir=/data
      - -volumeSizeLimitMB=1024
      - -defaultReplication=000
    ports:
      - "127.0.0.1:9333:9333"    # HTTP + admin UI
      - "127.0.0.1:19333:19333"  # gRPC - needed by `weed shell`
    volumes:
      - ./data/master:/data
      - ./config/master.toml:/etc/seaweedfs/master.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 12

  volume:
    image: chrislusf/seaweedfs:4.41
    restart: unless-stopped
    networks: [ storage ]
    container_name: seaweed-volume
    command:
      - volume
      - -mserver=master:9333
      - -ip=volume
      - -ip.bind=0.0.0.0
      - -port=8080
      - -dir=/data
      - -max=0
    volumes:
      - ./data/volume:/data
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/status" ]
      interval: 5s
      timeout: 3s
      retries: 12
    # no published ports: nothing outside the network addresses volumes directly

  filer:
    image: chrislusf/seaweedfs:4.41
    restart: unless-stopped
    networks: [ storage ]
    container_name: seaweed-filer
    command:
      - filer
      - -master=master:9333
      - -ip=filer
      - -ip.bind=0.0.0.0
      - -port=8888
    ports:
      - "127.0.0.1:8888:8888"    # filer UI / REST, handy while developing
      - "127.0.0.1:18888:18888"  # gRPC — needed by `weed shell`
    volumes:
      - ./data/filer:/data
      - ./config/filer.toml:/etc/seaweedfs/filer.toml:ro
    depends_on:
      volume:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8888/?limit=1" ]
      interval: 5s
      timeout: 3s
      retries: 12

  s3:
    image: chrislusf/seaweedfs:4.41
    restart: unless-stopped
    networks: [ storage ]
    container_name: seaweed-s3
    command:
      - s3
      - -filer=filer:8888
      - -ip.bind=0.0.0.0
      - -port=8333
      - -config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"    # nginx fronts this later
    volumes:
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      filer:
        condition: service_healthy

  admin:
    image: chrislusf/seaweedfs:4.41
    restart: unless-stopped
    networks: [ storage ]
    container_name: seaweed-admin
    command:
      - admin
      - -port=23646
      - -masters=master:9333
      - -dataDir=/data
#      - -adminUser=${SEAWEED_ADMIN_UI_USER:-admin}
#      - -adminPassword=${SEAWEED_ADMIN_UI_PASSWORD:?set SEAWEED_ADMIN_UI_PASSWORD in .env}
    ports:
      - "127.0.0.1:23646:23646"
    volumes:
      - ./data/admin:/data
    depends_on:
      filer:
        condition: service_healthy

networks:
  storage:
    driver: bridge