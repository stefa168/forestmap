spring:
  application:
    name: ForestmapJava

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: password

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    dev.stefa.forestmap: debug
    org.springframework.web: debug
    org.hibernate.sql: debug
    org.geotools.data.wfs: debug
    org.geotools.data.wfs.internal: debug

app:
  storage:
    internal-endpoint: http://localhost:8333
    public-endpoint: http://localhost:8333
    region: "eu"
    media-bucket: "asset"
    quarantine-bucket: "quarantine"
    app:
      access-key: ${APP_ACCESS_KEY}
      secret-key: ${APP_SECRET_KEY}
    uploader:
      access-key: ${UPLOADER_ACCESS_KEY}
      secret-key: ${UPLOADER_SECRET_KEY}
    presign-ttl: 5m

ade:
  max-features: 10
  wfs:
    base-url: https://wfs.cartografia.agenziaentrate.gov.it/inspire/wfs/owfs01.php
#    base-url: https://wfs.cartografia.agenziaentrate.gov.it/inspire/wfs/owfs01.php?service=WFS&version=2.0.0&request=GetCapabilities

cadastre:
  inspire:
    schema-dir: